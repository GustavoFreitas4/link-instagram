    <style>
      :root {
        /* CORES DA MARCA — ajuste os tons principais aqui */
        --color-bg: #080707;
        --color-bg-deep: #030303;
        --color-surface: #121010;
        --color-accent: #d81324;
        --color-accent-bright: #ff2233;
        --color-text: #f7f4f1;
        --color-muted: #b8b1ac;
        --color-border: rgba(255, 255, 255, 0.13);
        --color-border-accent: rgba(255, 34, 51, 0.28);

        --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
        --font-body: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page-width: 32rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--color-bg-deep);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgba(216, 19, 36, 0.16), transparent 27rem),
          linear-gradient(180deg, #0d0b0b 0%, var(--color-bg) 54%, var(--color-bg-deep) 100%);
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Textura de grão sutil para preservar o acabamento cinematográfico */
      body::before {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        background-image:
          repeating-radial-gradient(circle at 20% 30%, transparent 0, rgba(255, 255, 255, 0.05) 0.035rem, transparent 0.075rem, transparent 0.28rem),
          repeating-radial-gradient(circle at 78% 64%, transparent 0, rgba(255, 255, 255, 0.035) 0.03rem, transparent 0.07rem, transparent 0.24rem);
        background-size: 0.62rem 0.62rem, 0.76rem 0.76rem;
        content: "";
        opacity: 0.07;
        mix-blend-mode: soft-light;
      }

      a {
        color: inherit;
      }

      svg {
        display: block;
      }

      ::selection {
        background: var(--color-accent-bright);
        color: #fff;
      }

      .skip-link {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 100;
        padding: 0.65rem 0.9rem;
        border-radius: 0.45rem;
        background: var(--color-text);
        color: var(--color-bg);
        font-weight: 700;
        transform: translateY(-180%);
        transition: transform 180ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .page-shell {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(100%, var(--page-width));
        min-height: 100vh;
        min-height: 100dvh;
        margin-inline: auto;
        padding:
          max(2rem, env(safe-area-inset-top))
          1.125rem
          max(1.5rem, env(safe-area-inset-bottom));
        align-content: center;
        text-align: center;
      }

      .identity {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        display: grid;
        width: 7.6rem;
        height: 7.6rem;
        margin-bottom: 1.2rem;
        place-items: center;
        border: 1px solid var(--color-border-accent);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.025);
        box-shadow:
          0 0 0 0.35rem rgba(216, 19, 36, 0.035),
          0 1.25rem 3.5rem rgba(216, 19, 36, 0.18);
      }

      .brand-logo {
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
        object-fit: cover;
      }

      .brand-name {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(3.55rem, 17vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 0.9;
        text-transform: uppercase;
      }

      .brand-name span {
        color: var(--color-accent-bright);
        text-shadow: 0 0 1.5rem rgba(255, 34, 51, 0.2);
      }

      .brand-subtitle {
        margin: 0.8rem 0 0;
        color: var(--color-muted);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .divider {
        width: 2.75rem;
        height: 1px;
        margin: 1.35rem auto;
        background: linear-gradient(90deg, transparent, var(--color-accent-bright), transparent);
      }

      .presentation {
        max-width: 29rem;
        margin-inline: auto;
      }

      .presentation p {
        margin: 0;
      }

      .presentation-lead {
        color: var(--color-text);
        font-size: clamp(1.05rem, 4.8vw, 1.18rem);
        font-weight: 600;
        line-height: 1.5;
      }

      .presentation-detail {
        margin-top: 0.55rem !important;
        color: var(--color-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .service-area {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        margin: 1.45rem 0 0;
        padding: 0.7rem 1rem;
        border: 1px solid var(--color-border-accent);
        border-radius: 999px;
        background: rgba(216, 19, 36, 0.055);
        color: #ded8d3;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.35;
      }

      .service-area svg {
        width: 1.05rem;
        height: 1.05rem;
        flex: 0 0 auto;
        color: var(--color-accent-bright);
      }

      .actions {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.65rem;
      }

      .secondary-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .button {
        position: relative;
        display: inline-flex;
        min-height: 3.65rem;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding: 0.85rem 1rem;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 0.78rem;
        font-size: 0.94rem;
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .button svg {
        width: 1.35rem;
        height: 1.35rem;
        flex: 0 0 auto;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button:active {
        transform: translateY(0) scale(0.985);
      }

      .button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.92);
        outline-offset: 3px;
      }

      .button-primary {
        min-height: 3.9rem;
        background: linear-gradient(135deg, #d7182a, #b70d1d);
        color: #fff;
        box-shadow: 0 0.9rem 2.4rem rgba(216, 19, 36, 0.24);
        animation: cta-glow 3.2s ease-in-out infinite;
      }

      .button-primary:hover {
        box-shadow: 0 1rem 2.8rem rgba(255, 34, 51, 0.34);
      }

      .button-secondary {
        border-color: var(--color-border);
        background: rgba(255, 255, 255, 0.032);
        color: var(--color-text);
      }

      .button-secondary:hover {
        border-color: rgba(255, 34, 51, 0.34);
        background: rgba(216, 19, 36, 0.065);
      }

      @keyframes cta-glow {
        0%,
        100% {
          box-shadow: 0 0.85rem 2.2rem rgba(216, 19, 36, 0.2);
        }
        50% {
          box-shadow: 0 1rem 2.8rem rgba(255, 34, 51, 0.32);
        }
      }

      @media (max-width: 21.25rem) {
        .secondary-actions {
          grid-template-columns: 1fr;
        }
      }

      @media (min-width: 36rem) {
        .page-shell {
          padding-inline: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
