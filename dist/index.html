    />

    <style>
      :root {
        /* CORES DA MARCA — ajuste os tons principais aqui */
        --color-bg: #080707;
        --color-bg-deep: #030303;
        --color-surface: #121010;
        --color-accent: #d81324;
        --color-accent-bright: #ff2233;
        --color-text: #f7f4f1;
        --color-muted: #b8b1ac;
        --color-border: rgba(255, 255, 255, 0.13);
        --color-border-accent: rgba(255, 34, 51, 0.28);

        --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
        --font-body: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page-width: 32rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--color-bg-deep);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgba(216, 19, 36, 0.16), transparent 27rem),
          linear-gradient(180deg, #0d0b0b 0%, var(--color-bg) 54%, var(--color-bg-deep) 100%);
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Textura de grão sutil para preservar o acabamento cinematográfico */
      body::before {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        background-image:
          repeating-radial-gradient(circle at 20% 30%, transparent 0, rgba(255, 255, 255, 0.05) 0.035rem, transparent 0.075rem, transparent 0.28rem),
          repeating-radial-gradient(circle at 78% 64%, transparent 0, rgba(255, 255, 255, 0.035) 0.03rem, transparent 0.07rem, transparent 0.24rem);
        background-size: 0.62rem 0.62rem, 0.76rem 0.76rem;
        content: "";
        opacity: 0.07;
        mix-blend-mode: soft-light;
      }

      a {
        color: inherit;
      }

      svg {
        display: block;
      }

      ::selection {
        background: var(--color-accent-bright);
        color: #fff;
      }

      .skip-link {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 100;
        padding: 0.65rem 0.9rem;
        border-radius: 0.45rem;
        background: var(--color-text);
        color: var(--color-bg);
        font-weight: 700;
        transform: translateY(-180%);
        transition: transform 180ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .page-shell {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(100%, var(--page-width));
        min-height: 100vh;
        min-height: 100dvh;
        margin-inline: auto;
        padding:
          max(2rem, env(safe-area-inset-top))
          1.125rem
          max(1.5rem, env(safe-area-inset-bottom));
        align-content: center;
        text-align: center;
      }

      .identity {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        display: grid;
        width: 8.75rem;
        height: 8.75rem;
        margin-bottom: 1.2rem;
        place-items: center;
        border: 2px solid rgba(255, 34, 51, 0.46);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.025);
        box-shadow:
          0 0 0 0.22rem rgba(3, 3, 3, 0.9),
          0 0 0 0.31rem rgba(255, 34, 51, 0.2),
          0 0 1.7rem 0.22rem rgba(255, 34, 51, 0.36),
          0 1.25rem 3.5rem rgba(216, 19, 36, 0.22);
      }

      .brand-logo {
        width: 8.2rem;
        height: 8.2rem;
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
      }

      .brand-name {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(3.55rem, 17vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 0.9;
        text-transform: uppercase;
      }

      .brand-name span {
        color: var(--color-accent-bright);
        text-shadow: 0 0 1.5rem rgba(255, 34, 51, 0.2);
      }

      .brand-lockup {
        display: inline-grid;
        width: max-content;
        max-width: 100%;
        margin: 0.8rem 0 0;
      }

      .brand-subtitle,
      .brand-capture {
        font-family: var(--font-body);
        font-weight: 600;
        text-transform: uppercase;
      }

      .brand-subtitle {
        margin: 0;
        color: var(--color-muted);
        font-size: 0.875rem;
        letter-spacing: 0.2em;
        line-height: 1.4;
      }

      .brand-capture {
        display: flex;
        width: 100%;
        justify-content: space-between;
        margin: 0.3rem 0 0;
        color: var(--color-muted);
        font-size: 0.64rem;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }

      .actions {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      .secondary-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .button {
        position: relative;
        display: inline-flex;
        min-height: 3.65rem;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding: 0.85rem 1rem;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 0.78rem;
        font-size: 0.94rem;
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .button svg {
        width: 1.35rem;
        height: 1.35rem;
        flex: 0 0 auto;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button:active {
        transform: translateY(0) scale(0.985);
      }

      .button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.92);
        outline-offset: 3px;
      }

      .button-primary {
        min-height: 3.9rem;
        background: linear-gradient(135deg, #d7182a, #b70d1d);
        color: #fff;
        box-shadow: 0 0.9rem 2.4rem rgba(216, 19, 36, 0.24);
        animation: cta-glow 3.2s ease-in-out infinite;
      }

      .button-primary:hover {
        box-shadow: 0 1rem 2.8rem rgba(255, 34, 51, 0.34);
      }

      .button-secondary {
        border-color: var(--color-border);
        background: rgba(255, 255, 255, 0.032);
        color: var(--color-text);
      }

      .button-secondary:hover {
        border-color: rgba(255, 34, 51, 0.34);
        background: rgba(216, 19, 36, 0.065);
      }

      .services {
        margin-top: 2.75rem;
        text-align: left;
      }

      .services-title {
        display: flex;
        flex-wrap: wrap;
        gap: 0.22em;
        margin: 0 0 1.2rem;
        font-family: var(--font-display);
        font-size: clamp(2.55rem, 11vw, 3.35rem);
        font-weight: 400;
        letter-spacing: 0.035em;
        line-height: 0.92;
        text-transform: uppercase;
      }

      .services-title span {
        color: var(--color-accent-bright);
        text-shadow: 0 0 1.35rem rgba(255, 34, 51, 0.2);
      }

      .services-list {
        display: grid;
        grid-auto-rows: 1fr;
        gap: 0.8rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .service-card {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 8.35rem;
        grid-template-columns: 3rem minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        padding: 1rem calc(38% + 0.7rem) 1rem 1rem;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        background-color: #0b0a0b;
        box-shadow:
          -0.7rem 0 1.8rem -1.05rem rgba(255, 34, 51, 0.78),
          0.7rem 0 1.8rem -1.05rem rgba(255, 34, 51, 0.78),
          inset 1px 0 rgba(255, 34, 51, 0.22),
          inset -1px 0 rgba(255, 34, 51, 0.22);
      }

      .service-card::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: linear-gradient(90deg, rgba(216, 19, 36, 0.08), transparent 17%, transparent 83%, rgba(216, 19, 36, 0.08));
        content: "";
        pointer-events: none;
      }

      .service-icon {
        position: relative;
        z-index: 2;
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        color: var(--color-accent-bright);
        filter: drop-shadow(0 0 0.75rem rgba(255, 34, 51, 0.24));
      }

      .service-icon svg {
        width: 2.65rem;
        height: 2.65rem;
      }

      .service-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
      }

      .service-card h3 {
        min-width: 0;
        margin: 0;
        color: var(--color-text);
        font-family: var(--font-display);
        font-size: clamp(1.3rem, 5.8vw, 1.65rem);
        font-weight: 400;
        letter-spacing: 0.045em;
        line-height: 1.02;
        text-align: left;
        text-transform: uppercase;
      }

      .service-details {
        margin: 0.45rem 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-family: var(--font-body);
        font-size: clamp(0.59rem, 2.55vw, 0.71rem);
        font-weight: 400;
        letter-spacing: -0.005em;
        line-height: 1.38;
      }

      .service-details span {
        display: block;
        white-space: nowrap;
      }

      .service-media {
        position: absolute;
        z-index: 0;
        inset: 0 0 0 auto;
        width: 38%;
        overflow: hidden;
        border-radius: 0.82rem 0.95rem 0.95rem 0.82rem;
        background-image:
          linear-gradient(145deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0) 48%),
          var(--service-image, linear-gradient(135deg, #29292c 0%, #18181a 54%, #0d0d0e 100%));
        background-position: center;
        background-size: cover;
        box-shadow: inset 0.8rem 0 1.5rem rgba(0, 0, 0, 0.25);
      }

      .service-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .service-media::before {
        position: absolute;
        z-index: 1;
        inset: 0 auto 0 0;
        width: 58%;
        background: linear-gradient(90deg, #0b0a0b 0%, rgba(11, 10, 11, 0.8) 34%, rgba(11, 10, 11, 0.25) 74%, transparent 100%);
        content: "";
        pointer-events: none;
      }

      .service-media::after {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 78% 28%, rgba(255, 255, 255, 0.08), transparent 42%);
        content: "";
        pointer-events: none;
      }

      @keyframes cta-glow {
        0%,
        100% {
          box-shadow: 0 0.85rem 2.2rem rgba(216, 19, 36, 0.2);
        }
        50% {
          box-shadow: 0 1rem 2.8rem rgba(255, 34, 51, 0.32);
        }
      }

      @media (max-width: 27rem) {
        .service-card {
          grid-template-columns: 2.5rem minmax(0, 1fr);
          gap: 0.4rem;
          padding: 0.95rem calc(37% + 0.5rem) 0.95rem 0.7rem;
        }

        .service-icon {
          width: 2.5rem;
          height: 2.5rem;
        }

        .service-icon svg {
          width: 2.25rem;
          height: 2.25rem;
        }

        .service-card h3 {
          font-size: 1.35rem;
        }

        .service-details {
          font-size: 0.6rem;
          letter-spacing: -0.008em;
        }

        .service-media {
          width: 37%;
        }
      }

      @media (max-width: 21.25rem) {
        .secondary-actions {
          grid-template-columns: 1fr;
        }

        .service-card {
          min-height: 8.35rem;
          grid-template-columns: 2rem minmax(0, 1fr);
          gap: 0.25rem;
          padding: 0.85rem calc(36% + 0.25rem) 0.85rem 0.5rem;
        }

        .service-icon {
          width: 2rem;
          height: 2rem;
        }

        .service-icon svg {
          width: 1.8rem;
          height: 1.8rem;
        }

        .service-card h3 {
          font-size: 1.18rem;
        }

        .service-details {
          font-size: 0.54rem;
          letter-spacing: -0.012em;
        }

        .service-details span {
          white-space: nowrap;
        }

        .service-media {
          width: 36%;
        }
      }

      @media (max-width: 18.75rem) {
        .service-details span {
          white-space: normal;
        }
      }

      @media (min-width: 36rem) {
        .page-shell {
          padding-inline: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
